name: 03 API .NET

on:
  pull_request:
    paths:
      - apps/api/**
      - .github/workflows/03-api.yml
  push:
    branches: [main]
    paths:
      - apps/api/**
      - .github/workflows/03-api.yml

permissions:
  contents: read

jobs:
  ci-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Compilar
        run: dotnet build apps/api/Api.slnx --configuration Release
      - name: Testar com cobertura somente do projeto Api
        run: >-
          dotnet test apps/api/Api.slnx --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[Api]*"
      - name: Resumir cobertura e reprovar abaixo de 80%
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95  # v1.3.0
        with:
          filename: apps/api/**/TestResults/**/coverage.cobertura.xml
          format: markdown
          output: both
          indicators: true
          thresholds: '80 90'
          fail_below_min: true
      - name: Publicar resumo no job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f code-coverage-results.md ]; then
            cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
          fi
