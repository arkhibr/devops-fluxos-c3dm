name: 03 API .NET

on:
  pull_request:
    paths:
      - apps/api/**
      - .github/workflows/03-api.yml
  push:
    branches: [main]
    paths:
      - apps/api/**
      - .github/workflows/03-api.yml

permissions:
  contents: read

jobs:
  ci-api:
    uses: ./.github/workflows/lib-dotnet-ci.yml
    with:
      solucao: apps/api/Api.slnx
      diretorio: apps/api
      cobertura-minima: 80
      incluir-cobertura: '[Api]*'
