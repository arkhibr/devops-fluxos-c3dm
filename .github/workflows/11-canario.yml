name: 11 Canário

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Prefixo de 7 a 40 caracteres hexadecimais do commit da versão canário
        required: true
        type: string
      sha_anterior:
        description: Prefixo do commit da versão estável, que continua em produção. Vazio usa o mesmo commit da versão canário
        required: false
        type: string
        default: ""
      forcar_erros:
        description: Derruba o canário depois de iniciá-lo, para que as requisições a ele falhem e a remoção seja demonstrada
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

env:
  REGISTRO: ghcr.io/arkhibr/devops-fluxos-c3dm

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolver.outputs.sha }}
      sha7: ${{ steps.resolver.outputs.sha7 }}
      sha_anterior: ${{ steps.resolver.outputs.sha_anterior }}
      sha7_anterior: ${{ steps.resolver.outputs.sha7_anterior }}
    steps:
      - name: Autenticar no GHCR com o GITHUB_TOKEN
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validar as entradas e resolver os sha completos
        id: resolver
        env:
          SHA_NOVO: ${{ inputs.sha }}
          SHA_ANTERIOR: ${{ inputs.sha_anterior }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
        run: |
          SHA_ANTERIOR="${SHA_ANTERIOR:-$SHA_NOVO}"
          for entrada in "$SHA_NOVO" "$SHA_ANTERIOR"; do
            if ! [[ "$entrada" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error::Cada sha deve ter de 7 a 40 caracteres hexadecimais em minúsculas."
              exit 1
            fi
          done
          sha=$(gh api "repos/${REPOSITORIO}/commits/${SHA_NOVO}" --jq .sha)
          sha_anterior=$(gh api "repos/${REPOSITORIO}/commits/${SHA_ANTERIOR}" --jq .sha)
          {
            echo "sha=${sha}"
            echo "sha7=${sha:0:7}"
            echo "sha_anterior=${sha_anterior}"
            echo "sha7_anterior=${sha_anterior:0:7}"
          } >> "$GITHUB_OUTPUT"
      - name: Conferir que as duas imagens existem no registro
        env:
          SHA7: ${{ steps.resolver.outputs.sha7 }}
          SHA7_ANTERIOR: ${{ steps.resolver.outputs.sha7_anterior }}
        run: |
          for sha7 in "$SHA7" "$SHA7_ANTERIOR"; do
            imagem="${REGISTRO}-api:sha-${sha7}"
            if ! docker buildx imagetools inspect "$imagem" > /dev/null; then
              echo "::error::A imagem ${imagem} não existe. Ela só é publicada quando o workflow 08 roda sobre o commit."
              exit 1
            fi
          done

  implantar:
    needs: preparar
    runs-on: ubuntu-latest
    environment: producao
    concurrency:
      group: implantacao-producao
      cancel-in-progress: false
    env:
      SHA7_ESTAVEL: ${{ needs.preparar.outputs.sha7_anterior }}
      VERSAO_ESTAVEL: ${{ needs.preparar.outputs.sha_anterior }}
      SHA7_CANARIO: ${{ needs.preparar.outputs.sha7 }}
      VERSAO_CANARIO: ${{ needs.preparar.outputs.sha }}
      COMPOSE_PROJECT_NAME: c3dm-canario
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Autenticar no GHCR com o GITHUB_TOKEN
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Subir a versão estável, o canário e o roteador
        run: |
          docker compose -f cenarios/11-canario/compose.yml up -d
          esperar() {
            for _ in $(seq 1 30); do
              resposta=$(curl -fsS --max-time 5 "http://127.0.0.1:$1/api/v1/versao" 2>/dev/null) \
                && [ "$(jq -r .cor <<< "$resposta")" = "$2" ] \
                && [ "$(jq -r .versao <<< "$resposta")" = "$3" ] \
                && { echo "Porta $1: ${resposta}"; return 0; }
              sleep 2
            done
            echo "::error::Porta $1: esperado cor=$2 e versao=$3."
            docker compose -f cenarios/11-canario/compose.yml logs
            return 1
          }
          esperar 8091 estavel "$VERSAO_ESTAVEL"
          esperar 8092 canario "$VERSAO_CANARIO"
      - name: Enviar 10 por cento das requisições ao canário
        run: |
          cenarios/11-canario/ajustar-pesos.sh weight=9 weight=1
          # Os processos antigos do NGINX encerram aos poucos e respondem 404 por instantes.
          # A amostragem só começa depois de dez respostas seguidas com sucesso.
          for _ in $(seq 1 30); do
            falhas=0
            for _ in $(seq 1 10); do
              curl -fsS --max-time 5 http://127.0.0.1:8081/api/v1/versao > /dev/null 2>&1 || falhas=$((falhas + 1))
            done
            [ "$falhas" -eq 0 ] && exit 0
            sleep 1
          done
          echo "::error::O roteador não estabilizou depois do ajuste de pesos."
          exit 1
      - name: Derrubar o canário para forçar erros
        if: ${{ inputs.forcar_erros }}
        run: |
          echo "::warning::Erros forçados: o canário foi parado e as requisições encaminhadas a ele vão falhar."
          docker compose -f cenarios/11-canario/compose.yml stop canario
      - name: Gerar 200 requisições pelo roteador
        run: |
          for _ in $(seq 1 200); do
            if cor=$(curl -fsS --max-time 5 http://127.0.0.1:8081/api/v1/versao 2>/dev/null | jq -er .cor); then
              echo "$cor"
            else
              echo erro
            fi
          done > "$RUNNER_TEMP/amostras.txt"
          sort "$RUNNER_TEMP/amostras.txt" | uniq -c
      - name: Analisar a proporção do canário e os erros
        run: python3 cenarios/11-canario/analisar.py --peso 0.10 --tolerancia 0.06 < "$RUNNER_TEMP/amostras.txt"
      - name: Promover o canário a 100 por cento do tráfego
        run: |
          cenarios/11-canario/ajustar-pesos.sh fora weight=1
          for _ in $(seq 1 15); do
            unicas=$(for _ in $(seq 1 20); do
              curl -fsS --max-time 5 http://127.0.0.1:8081/api/v1/versao | jq -r .cor
            done | sort -u | tr '\n' ' ')
            if [ "$unicas" = "canario " ]; then
              echo "Todo o tráfego está no canário."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Depois da promoção o roteador ainda devolve: ${unicas}"
          exit 1
      - name: Remover o canário e manter a versão estável
        if: failure()
        run: |
          docker compose -f cenarios/11-canario/compose.yml logs canario roteador
          cenarios/11-canario/ajustar-pesos.sh weight=1 fora
          for _ in $(seq 1 15); do
            unicas=$(for _ in $(seq 1 20); do
              curl -fsS --max-time 5 http://127.0.0.1:8081/api/v1/versao | jq -r .cor
            done | sort -u | tr '\n' ' ')
            if [ "$unicas" = "estavel " ]; then
              echo "::warning::Canário removido: o tráfego voltou para a versão estável e o lançamento foi reprovado."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Depois da remoção o roteador ainda devolve: ${unicas}"
          exit 1
      - name: Remover os contêineres
        if: always()
        run: docker compose -f cenarios/11-canario/compose.yml down -v
