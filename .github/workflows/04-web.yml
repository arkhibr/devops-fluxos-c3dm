name: 04 Aplicação web React

on:
  pull_request:
    paths:
      - apps/web/**
      - .github/workflows/04-web.yml
  push:
    branches: [main]
    paths:
      - apps/web/**
      - .github/workflows/04-web.yml

permissions:
  contents: read

jobs:
  ci-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Instalar dependências a partir do lockfile
        run: npm ci
      - name: Analisar o código com ESLint
        run: npm run lint
      - name: Verificar tipos com o TypeScript
        run: npm run typecheck
      - name: Testar com cobertura mínima de 80%
        run: npm test
      - name: Compilar para produção
        run: npm run build
      - name: Publicar o resultado da compilação
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
