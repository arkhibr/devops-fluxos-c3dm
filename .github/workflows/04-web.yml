name: 04 Aplicação web React

on:
  pull_request:
    paths:
      - apps/web/**
      - .github/workflows/04-web.yml
      - .github/workflows/lib-web-ci.yml
      - .github/actions/resumo-falha/**
  push:
    branches: [main]
    paths:
      - apps/web/**
      - .github/workflows/04-web.yml
      - .github/workflows/lib-web-ci.yml
      - .github/actions/resumo-falha/**

permissions:
  contents: read

jobs:
  ci-web:
    uses: ./.github/workflows/lib-web-ci.yml
    with:
      diretorio: apps/web
      node-version: '24'
