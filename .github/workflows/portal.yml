---
name: Portal

# Sem filtro de paths: o job build é verificação obrigatória e precisa rodar em todo pull request.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-docs.txt
      - name: Compilar o portal em modo estrito
        run: mkdocs build --strict
      - name: Empacotar o portal para publicação
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  publicar:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.implantacao.outputs.page_url }}
    concurrency:
      group: implantacao-portal
      cancel-in-progress: false
    steps:
      - name: Publicar no GitHub Pages
        id: implantacao
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
