# Configuração do Gitleaks do repositório. Estende as regras padrão e define duas
# exceções restritas: a pasta de fixtures do cenário 06, que contém um segredo falso
# de propósito, e o nome da imagem de contêiner num teste do cenário 08.
[extend]
useDefault = true

[[allowlists]]
description = "Fixtures do cenário 06, que devem ser reprovados pela varredura de segredos"
paths = ['''^cenarios/06-seguranca-estatica/fixtures/''']

[[allowlists]]
description = "Falso positivo: nome da imagem no teste do cenário 08"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/pipelines/test_08_artefato\.py$''']
regexes = ['''devops-fluxos-c3dm-(api|web)''']
